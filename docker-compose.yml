services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: notifications_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_ENV=${APP_ENV:-local}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - notifications

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: notifications_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - notifications

  postgres:
    image: postgres:16-alpine
    container_name: notifications_postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT_EXTERNAL:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-notifications_service}
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-root} -d ${DB_DATABASE:-notifications_service}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - notifications

volumes:
  postgres_data:
    driver: local

networks:
  notifications:
    driver: bridge
