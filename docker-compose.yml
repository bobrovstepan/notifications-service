version: '3.9'

x-app-env: &app-env
    APP_ENV: local
    APP_KEY: ${APP_KEY}
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-notifications_db}
    DB_USERNAME: ${DB_USERNAME:-notify_user}
    DB_PASSWORD: ${DB_PASSWORD:-secret}
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: 5672
    RABBITMQ_USER: ${RABBITMQ_USER:-guest}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    REDIS_HOST: redis
    REDIS_PORT: 6379

x-app-base: &app-base
    build:
        context: .
        dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www
    volumes:
        - .:/var/www
    environment:
        <<: *app-env

services:
    app:
        <<: *app-base
        container_name: notification_app
        ports:
            - "8000:8000"
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: >
            sh -c "php artisan migrate --force &&
                   php artisan db:seed --force &&
                   php artisan l5-swagger:generate &&
                   php artisan serve --host=0.0.0.0 --port=8000"

    worker_high:
        <<: *app-base
        container_name: notification_worker_high
        depends_on:
            - app
        command: php artisan queue:work rabbitmq --queue=notifications.transactional --tries=3 --backoff=5 --sleep=1

    worker_standard:
        <<: *app-base
        container_name: notification_worker_standard
        depends_on:
            - app
        command: php artisan queue:work rabbitmq --queue=notifications.marketing --tries=3 --backoff=10 --sleep=3

    postgres:
        image: postgres:16-alpine
        container_name: notification_postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-notifications_db}
            POSTGRES_USER: ${DB_USERNAME:-notify_user}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
        ports:
            - "5432:5432"
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-notify_user} -d ${DB_DATABASE:-notifications_db}" ]
            interval: 5s
            timeout: 5s
            retries: 10

    rabbitmq:
        image: rabbitmq:3.13-management-alpine
        container_name: notification_rabbitmq
        restart: unless-stopped
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "ping"]
            interval: 10s
            timeout: 10s
            retries: 10

    redis:
        image: redis:7-alpine
        container_name: notification_redis
        restart: unless-stopped
        command: redis-server --appendonly yes
        volumes:
            - redis_data:/data
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    postgres_data:
    rabbitmq_data:
    redis_data:
